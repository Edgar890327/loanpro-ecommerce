name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Store.slnx
      - run: dotnet build Store.slnx --configuration Release --no-restore
      - run: dotnet test tests/Store.UnitTests/Store.UnitTests.csproj --configuration Release --no-build -p:CollectCoverage=true -p:Threshold=80 -p:ThresholdType=line -p:ThresholdStat=total -p:ExcludeByFile="**/Program.cs%2c**/StoreDbContextFactory.cs%2c**/Migrations/*.cs%2c**/EfCoreErrorLogBatchStore.cs%2c**/Endpoints/**/*.cs%2c**/ProductImportService.cs%2c**/ProductCatalogReader.cs%2c**/ProductAdministration.cs%2c**/ErrorLogReader.cs%2c**/DatabaseHealthReader.cs%2c**/Entities/ImportBatch.cs%2c**/Entities/StockMovement.cs%2c**/Products/Administration/*.cs%2c**/Catalog/CatalogCategoryResponse.cs%2c**/Catalog/CatalogPage.cs%2c**/Catalog/CatalogProductResponse.cs%2c**/ErrorLogging/ErrorLogPage.cs%2c**/ErrorLogging/ErrorLogQuery.cs%2c**/Products/Importing/ProductImportReport.cs%2c**/Products/Importing/ProductImportResult.cs%2c**/Products/Importing/ProductImportSummary.cs%2c**/Products/Importing/ProductImportRowReport.cs"
      - run: dotnet test tests/Store.IntegrationTests/Store.IntegrationTests.csproj --configuration Release --no-build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build
