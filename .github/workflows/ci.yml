name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Store.slnx
      - run: dotnet build Store.slnx --configuration Release --no-restore
      - run: |
          EX=$(grep -o 'ExcludeByFile="[^"]*"' README.md | head -1)
          dotnet test tests/Store.UnitTests/Store.UnitTests.csproj --configuration Release --no-build -p:CollectCoverage=true -p:Threshold=80 -p:ThresholdType=line -p:ThresholdStat=total "-p:${EX}"
      - run: dotnet test tests/Store.IntegrationTests/Store.IntegrationTests.csproj --configuration Release --no-build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: npm --prefix e2e run docker:e2e
