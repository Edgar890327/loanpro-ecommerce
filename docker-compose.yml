services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-store}
      POSTGRES_USER: ${POSTGRES_USER:-store}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-store-local-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB:-store};Username=${POSTGRES_USER:-store};Password=${POSTGRES_PASSWORD:-store-local-only}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin-local-123}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-30}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-store_session}
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me-0123456789abcdef}
      JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES:-30}
      RESERVATION_TTL_MINUTES: ${RESERVATION_TTL_MINUTES:-15}
      RESERVATION_TTL_SECONDS: ${RESERVATION_TTL_SECONDS:-}
      RESERVATION_SCAN_INTERVAL_SECONDS: ${RESERVATION_SCAN_INTERVAL_SECONDS:-15}
      Shipping__FlatRateUsd: ${Shipping__FlatRateUsd:-0.00}
      ERROR_LOG_RETENTION_DAYS: ${ERROR_LOG_RETENTION_DAYS:-30}
      E2E_MODE: "false"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  postgres-data:
